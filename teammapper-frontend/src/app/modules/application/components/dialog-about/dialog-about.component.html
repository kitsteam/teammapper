<h2 mat-dialog-title>{{ applicationName }} {{ version }}</h2>
<mat-dialog-content>
  <div class="about-modal-section">
    <img
      class="about-kits-logo"
      alt="kits logo"
      src="./assets/images/kits-logo.svg"
      width="150" />
    {{ 'PAGES.ABOUT.INTRODUCTION.APPLICATION_DESCRIPTION' | translate }}
    <br /><br />
    <a
      href="https://github.com/kitsteam/teammapper"
      class="link"
      target="_blank">
      GitHub
    </a>
    · <a href="https://kits.blog/impressum/" target="_blank">Impressum</a> ·
    <a href="https://kits.blog/datenschutz/#teammapper" target="_blank"
      >Datenschutz</a
    >
  </div>
  <br />
  <div class="about-modal-section">
    <div class="hint-box">
      {{ 'MODALS.INFO.DELETION_MOVED' | translate }}
    </div>
  </div>
  <section class="about-modal-section shortcuts-section">
    <h3>{{ 'MODALS.INFO.SHORTCUTS_TITLE' | translate }}</h3>
    <teammapper-shortcut-list></teammapper-shortcut-list>
  </section>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-raised-button [mat-dialog-close]="true">
    {{ 'MODALS.GENERAL.BUTTON_CLOSE' | translate }}
  </button>
</mat-dialog-actions>
